      no_selection: Select at least one emoji
      invalid_shortcodes: "These shortcodes do not exist or cannot be added to favorites: %{shortcodes}"
      empty_packs: Create a collection first
    admin:
      sections:
        title: Emoji sections
        manage: Manage sections
        add_new: Add section
        edit: Edit section
        delete: Delete sections
      packs:
        manage: Manage emoji packs
        edit: Edit emoji pack
        publish: Refresh cache
        refresh: Sync list
        refreshed: "List synced. Removed %{packs} collections belonging to %{users} users."
        reorder: Reorder
        set_section: Set section
        no_selection: Select at least one emoji pack
        selected_count: "%{count} emoji packs selected."
        set_default: Set as default
        remove_default: Remove default
        preset: Preset
    picker:
      search: Search emoji
      all_emojis: All emoji
      enabled_emojis: Enabled emoji
  activerecord:
    models:
      wxw/emoji_section: Emoji section
      wxw/emoji_pack: Emoji pack
    attributes:
      wxw/emoji_section:
        name: Name
      wxw/emoji_pack:
        featured_shortcode: Icon
        category_name: Category
        name: Name
        section: Section

